version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: tradecopy_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tradecopy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tradecopy_secret}
      POSTGRES_DB: ${POSTGRES_DB:-tradecopy}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tradecopy}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: tradecopy_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    container_name: tradecopy_api
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-tradecopy}:${POSTGRES_PASSWORD:-tradecopy_secret}@postgres:5432/${POSTGRES_DB:-tradecopy}
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-your-secret-key-change-in-production}
      - DEBUG=${DEBUG:-false}
    ports:
      - "8000:8000"
    volumes:
      - ../backend:/app/backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  celery_worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.worker
    container_name: tradecopy_celery_worker
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-tradecopy}:${POSTGRES_PASSWORD:-tradecopy_secret}@postgres:5432/${POSTGRES_DB:-tradecopy}
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-your-secret-key-change-in-production}
    volumes:
      - ../workers:/app/workers
      - ../backend:/app/backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  celery_beat:
    build:
      context: ..
      dockerfile: docker/Dockerfile.worker
    container_name: tradecopy_celery_beat
    command: celery -A workers.celery_app beat --loglevel=info
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-tradecopy}:${POSTGRES_PASSWORD:-tradecopy_secret}@postgres:5432/${POSTGRES_DB:-tradecopy}
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ../workers:/app/workers
      - ../backend:/app/backend
    depends_on:
      - celery_worker
    restart: unless-stopped

  telegram_listener:
    build:
      context: ..
      dockerfile: docker/Dockerfile.telegram
    container_name: tradecopy_telegram
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-tradecopy}:${POSTGRES_PASSWORD:-tradecopy_secret}@postgres:5432/${POSTGRES_DB:-tradecopy}
      - REDIS_URL=redis://redis:6379/0
      - TELEGRAM_API_ID=${TELEGRAM_API_ID}
      - TELEGRAM_API_HASH=${TELEGRAM_API_HASH}
      - TELEGRAM_SESSION_STRING=${TELEGRAM_SESSION_STRING}
    volumes:
      - ../telegram_listener:/app/telegram_listener
      - telegram_sessions:/app/sessions
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    container_name: tradecopy_frontend
    ports:
      - "3000:3000"
    volumes:
      - ../frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  telegram_sessions:
